active: test

defaults:
  api:
    connect_timeout: 5
    read_timeout: 30
    verify_ssl: true
  browser:
    type: chromium
    headless: true
    slow_mo: 0
    viewport:
      width: 1440
      height: 900
    ignore_https_errors: false
  artifacts:
    directory: artifacts

environments:
  local:
    api:
      base_url: "${TMS_API_BASE_URL:-http://127.0.0.1:8000}"
      token: "${TMS_ACCESS_TOKEN:-}"
    ui:
      base_url: "${TMS_UI_BASE_URL:-http://111.160.91.170:58081}"
      username: "${TMS_UI_USERNAME:-admin}"
      password: "${TMS_UI_PASSWORD:-admin123}"
      auth:
        captcha_max_attempts: 3
        login_timeout_ms: 15000
  test:
    api:
      base_url: "${TMS_API_BASE_URL:-http://111.160.91.170:59999}"
      token: "${TMS_ACCESS_TOKEN:-123}"
    ui:
      base_url: "${TMS_UI_BASE_URL:-http://111.160.91.170:58081}"
      username: "${TMS_UI_USERNAME:-admin}"
      password: "${TMS_UI_PASSWORD:-admin123}"
      auth:
        captcha_max_attempts: 3
        login_timeout_ms: 15000
